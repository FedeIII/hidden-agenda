# hidden-agenda.azyr.io
#
# Install to /etc/nginx/sites-available/hidden-agenda.azyr.io and symlink into sites-enabled.
#
# Modelled on journal.azyr.io for the TLS and header block, with two deliberate departures:
#   - journal proxies everything; this site serves static files from disk and proxies only /ws
#     and /healthz, so it has a root/try_files block journal has no equivalent of.
#   - journal sets Connection 'upgrade' on every location. That belongs on the websocket and
#     nowhere else.
#
# It deliberately does NOT include the Cloudflare Authenticated Origin Pulls (mTLS) snippet that
# osler.azyr.io uses. This site should be reachable from a plain curl on the loopback.

server {
	listen 80;
	listen [::]:80;
	server_name hidden-agenda.azyr.io;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name hidden-agenda.azyr.io;

	# Cloudflare Origin Certificate. Already covers this name: SANs are *.azyr.io and azyr.io.
	ssl_certificate /etc/nginx/ssl/azyr.io.pem;
	ssl_certificate_key /etc/nginx/ssl/azyr.io.key;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;

	access_log /var/log/nginx/hidden-agenda.azyr.io.access.log;
	error_log /var/log/nginx/hidden-agenda.azyr.io.error.log;

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	root /opt/hidden-agenda/docs;
	index index.html;

	# 8 KB is the server's own message cap; nothing here needs a large body.
	client_max_body_size 64k;

	# The websocket. proxy_read_timeout has to outlast a quiet game: the server pings every 25s,
	# which also keeps Cloudflare from dropping the connection at ~100s.
	location = /ws {
		proxy_pass http://127.0.0.1:3007;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;

		# SET, not $proxy_add_x_forwarded_for. The server keys its join rate limit on this, and
		# appending would let a client prepend a value of its own to get a fresh bucket each try.
		proxy_set_header X-Forwarded-For $remote_addr;

		# A websocket must never be cached, whatever a Cloudflare rule might say.
		proxy_cache_bypass 1;
	}

	location = /healthz {
		proxy_pass http://127.0.0.1:3007;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		add_header Cache-Control "no-store" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	}

	# NOTE on the repetition below. In nginx, add_header directives are inherited by a location
	# ONLY if that location declares none of its own — one add_header drops the whole inherited
	# set. So every location that sets a Cache-Control has to restate the security headers it
	# still wants. Removing the duplication silently removes the headers.

	# Vite emits content-hashed filenames, so these are safe to pin hard. A new build produces new
	# names, which is why immutable is right here and would have been a year-long bug on a fixed
	# main.js — the exact trap the azyr.io site config already documents.
	location /assets/ {
		try_files $uri =404;
		# One Cache-Control, set explicitly. `expires` emits a Cache-Control of its own, so
		# pairing it with add_header sends the header twice — verified on the box.
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	}

	# Piece art. Names are stable, so revalidate rather than pin for a year.
	location /img/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=604800" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	}

	# The app itself. A request for / is served from here via try_files, NOT by a
	# `location = /index.html` — try_files serves the file within this location and does not
	# re-run location matching. So the no-store that keeps the entry point pointing at the current
	# hashed bundle has to live here, or it never applies to the page anybody actually loads.
	#
	# The room code lives in the URL fragment, which never reaches the server, so there are no deep
	# paths to route — but a stray path should still land on the app rather than a 404.
	location / {
		try_files $uri $uri/ /index.html;

		add_header Cache-Control "no-store" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer-when-downgrade" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	}
}
