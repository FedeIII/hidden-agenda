# Cloudflare Authenticated Origin Pulls for hidden-agenda.azyr.io.
#
# Install to /etc/nginx/snippets/hidden-agenda-mtls.conf. The site config includes it by GLOB
# (`include /etc/nginx/snippets/hidden-agenda-mtls*.conf;`), so:
#   - until the file is copied in, nothing changes and nginx stays happy
#   - moving the file aside and reloading is the rollback, with no config edit
#
# With this on, only Cloudflare can reach the origin: anyone who finds the IP and connects
# directly gets a TLS-level refusal instead of the site. It matches osler.azyr.io and
# wallet.azyr.io, the other two subdomains on this box.
#
# It also changes what a healthy stack looks like from the box itself:
#
#   curl -k https://127.0.0.1/ -H 'Host: hidden-agenda.azyr.io'
#     -> 400 "No required SSL certificate was sent"  ← correct, not a fault
#
# Smoke-test the loopback upstream (http://127.0.0.1:3007/healthz) and the public URL instead.
#
# The zone-level setting must also be on (it is — Cloudflare only presents its client
# certificate when Authenticated Origin Pulls is enabled for the zone).

ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
